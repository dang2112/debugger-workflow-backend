[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbfl-demo-project"
version = "0.1.0"
description = "Minimal function-level SBFL + runtime trace collector demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pytest>=8.0"]

[project.scripts]
sbfl = "sbfl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
